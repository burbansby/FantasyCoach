[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantasycoach"
version = "0.1.0"
description = "Fantasy football advice from your Sleeper league: start/sit and waiver wire recommendations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fantasycoach = "fantasycoach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasycoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
