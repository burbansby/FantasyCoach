<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FantasyCoach</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<style>
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;
  --surface-2: #f0f2ee;
  --border: #e1e4dd;
  --text: #1a1f1a;
  --muted: #69716a;
  --accent: #1f8a4c;
  --accent-soft: #e3f3e8;
  --danger: #c43c3c;
  --danger-soft: #fbe7e7;
  --warn: #a86b00;
  --warn-soft: #fbf0d9;
  --shadow: 0 1px 2px rgba(20, 30, 20, .06), 0 4px 16px rgba(20, 30, 20, .05);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1311;
    --surface: #171c19;
    --surface-2: #1e2420;
    --border: #2a322d;
    --text: #e8ece8;
    --muted: #8f9a92;
    --accent: #3ecf7a;
    --accent-soft: #173323;
    --danger: #ff7b7b;
    --danger-soft: #3a1c1c;
    --warn: #f0b545;
    --warn-soft: #3a2e14;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 48px; }

header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 18px 0; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 19px; letter-spacing: -.01em; }
.brand .mark {
  width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 18px;
}
.account { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.account .who { color: var(--muted); font-size: 14px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.pad { padding: 20px; }

.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
  padding: 8px 14px; cursor: pointer; font-weight: 550;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.05); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.small { padding: 5px 10px; font-size: 13px; }
input[type=text], select {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 12px;
}
input[type=text]:focus, select:focus, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* setup */
.hero { text-align: center; padding: 48px 20px; }
.hero h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; }
.hero p { margin: 0 0 22px; color: var(--muted); }
.hero form { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.hero input { width: min(280px, 100%); }
.league-list { display: grid; gap: 10px; margin-top: 24px; text-align: left; max-width: 460px; margin-inline: auto; }
.league-btn {
  display: flex; justify-content: space-between; align-items: center; width: 100%;
  padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2);
  cursor: pointer; text-align: left;
}
.league-btn:hover { border-color: var(--accent); }
.league-btn small { color: var(--muted); }

/* toolbar */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 7px 16px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tab[aria-selected=true] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.stepper button { border: 0; background: transparent; padding: 7px 11px; cursor: pointer; color: var(--muted); }
.stepper button:hover { color: var(--text); }
.stepper span { min-width: 64px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 11px;
  font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted);
}
.chip[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* summary */
.summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.summary .big { font-size: 30px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.summary .label { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.gain { color: var(--accent); font-weight: 700; }
.ok-pill { background: var(--accent-soft); color: var(--accent); padding: 6px 12px; border-radius: 999px; font-weight: 650; font-size: 14px; }

.changes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.changes h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
.changes .start h3 { color: var(--accent); }
.changes .bench h3 { color: var(--danger); }
@media (max-width: 600px) { .changes { grid-template-columns: 1fr; } }

/* player rows */
.rows { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 12px;
  padding: 10px 16px; border-top: 1px solid var(--border);
}
.rows .row:first-child { border-top: 0; }
.row.new { background: linear-gradient(90deg, var(--accent-soft), transparent 60%); }
.row.benched { background: linear-gradient(90deg, var(--danger-soft), transparent 60%); }
.slot {
  font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface-2);
  border-radius: 8px; padding: 4px 0; text-align: center; letter-spacing: .02em;
}
.who-cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); flex: none;
  object-fit: cover; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.pname { font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pmeta { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pts { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.pts small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.pts .rng { display: block; font-weight: 500; color: var(--muted); font-size: 11px; white-space: nowrap; }
.rangebox { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.rb-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.rb-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; text-align: center; }
.rb-nums b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.rb-nums small { color: var(--muted); font-size: 11px; }
.rbar { position: relative; height: 8px; border-radius: 8px; background: var(--border); margin: 10px 2px 2px; }
.rbar .band { position: absolute; top: 0; bottom: 0; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--accent); }
.rbar .mk { position: absolute; top: -3px; width: 2px; height: 14px; border-radius: 2px; transform: translateX(-1px); }
.rbar .mk.exp { background: var(--accent); }
.rbar .mk.slp { background: var(--muted); }
.chip-mini { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; text-transform: none; letter-spacing: 0; }
.chip-mini.dk { background: var(--accent-soft); color: var(--accent); }
.chip-mini.model { background: var(--border); color: var(--muted); }
.legend { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.5; }
.team-range { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.tr-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-bottom: 4px; }
.tr-nums .label { display: block; font-size: 11px; }
.tr-nums b { font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; }
.tr-row { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
.tr-row em { font-style: normal; font-variant-numeric: tabular-nums; }
.tr-row .rbar { margin: 8px 2px; }
.muted-bar .band { background: var(--surface-2); border-color: var(--muted); }
.muted-bar .mk.exp { background: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
.badge.q { background: var(--warn-soft); color: var(--warn); }
.badge.o { background: var(--danger-soft); color: var(--danger); }
.badge.up { background: var(--accent-soft); color: var(--accent); }
.badge.down { background: var(--danger-soft); color: var(--danger); }
.empty-slot { color: var(--danger); font-weight: 600; }
.section-label { padding: 14px 16px 6px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-top: 1px solid var(--border); }
.bench-row { opacity: .75; }

/* waivers */
.pick { display: grid; grid-template-columns: 28px 1fr 1fr 84px; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--border); }
.rows .pick:first-child { border-top: 0; }
.rank { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.side-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
.side-label.add { color: var(--accent); }
.side-label.drop { color: var(--danger); }
.gainbox { text-align: right; }
.gainbox .gain { font-size: 18px; }
.bar { height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.pick-head { display: grid; grid-template-columns: 28px 1fr 1fr 84px; gap: 12px; padding: 12px 16px 0; color: var(--muted); font-size: 12px; }
@media (max-width: 640px) {
  .pick { grid-template-columns: 22px 1fr 64px; }
  .pick .drop-cell { grid-column: 2 / 3; }
  .pick .gainbox { grid-row: 1 / 3; grid-column: 3; }
  .pick-head { display: none; }
  .row { grid-template-columns: 52px 1fr auto; padding: 10px 12px; }
}

.notice { padding: 14px 16px; border-radius: 12px; margin-bottom: 14px; }
.notice.error { background: var(--danger-soft); color: var(--danger); }
.muted { color: var(--muted); }
.center { text-align: center; padding: 40px 16px; }
.spinner {
  width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* players */
.psearch { position: relative; flex: 1 1 260px; max-width: 420px; }
.psearch input { width: 100%; padding-left: 34px; }
.psearch .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.suggest {
  position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; right: 0; list-style: none; margin: 0; padding: 4px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18);
}
.suggest li { padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.suggest li[aria-selected=true], .suggest li:hover { background: var(--surface-2); }
.suggest .avatar { width: 30px; height: 30px; }
.players-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.pchip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 3px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600;
}
.pchip .avatar { width: 24px; height: 24px; font-size: 10px; }
.pchip button { border: 0; background: var(--surface-2); color: var(--muted); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; padding: 0; }
.pchip button:hover { color: var(--danger); }
.pcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 14px; }
.pcard { padding: 16px; position: relative; }
.pcard.best { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, var(--shadow); }
.pcard .crown { position: absolute; top: 12px; right: 12px; }
.pcard .big { font-size: 28px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 12px; }
.pcard .sub { display: flex; gap: 14px; color: var(--muted); font-size: 13px; margin-top: 2px; }
.pcard .sub b { color: var(--text); font-weight: 650; }
.statline { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.statline b { color: var(--text); font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.grid th, table.grid td { padding: 10px 14px; text-align: right; border-top: 1px solid var(--border); white-space: nowrap; }
table.grid thead th { border-top: 0; font-size: 12px; color: var(--muted); font-weight: 650; }
table.grid th:first-child, table.grid td:first-child { text-align: left; }
table.grid td .opp { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
table.grid td.win { color: var(--accent); font-weight: 750; }
table.grid tfoot td { font-weight: 700; }
.verdict { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.verdict .avatar { width: 44px; height: 44px; }
.verdict .big { font-size: 20px; }
.signed-out-cta { text-align: center; padding: 40px 20px; }
.signed-out-cta h2 { margin: 0 0 6px; font-size: 20px; }
.signed-out-cta p { margin: 0 0 16px; color: var(--muted); }
.linkish { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; margin-top: 18px; }
.linkish:hover { text-decoration: underline; }
.hidden { display: none !important; }
footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="mark">🏈</div>FantasyCoach</div>
    <div class="account hidden" id="account">
      <span class="account signed-in-only">
        <span class="who" id="who"></span>
        <select id="league-select" aria-label="League"></select>
        <button class="btn small" id="switch-user">Switch user</button>
      </span>
      <button class="btn small primary signed-out-only" id="sign-in">Connect Sleeper</button>
    </div>
  </header>

  <!-- Setup -->
  <section id="setup" class="card hero hidden">
    <h1>Your weekly fantasy coach</h1>
    <p>Enter your Sleeper username to get start/sit and waiver advice for your league.</p>
    <form id="user-form">
      <input type="text" id="username" placeholder="Sleeper username" autocomplete="username" required>
      <button class="btn primary" type="submit" id="user-submit">Find my leagues</button>
    </form>
    <div id="setup-error" class="notice error hidden" style="max-width:460px;margin:18px auto 0"></div>
    <div class="league-list" id="league-list"></div>
    <button class="linkish" id="skip-setup">Or just look up players without signing in →</button>
  </section>

  <!-- Main -->
  <main id="main" class="hidden">
    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="lineup" aria-selected="true">Start / Sit</button>
        <button class="tab" role="tab" data-tab="waivers" aria-selected="false">Waiver Wire</button>
        <button class="tab" role="tab" data-tab="players" aria-selected="false">Players</button>
      </div>
      <div class="controls">
        <div class="stepper" aria-label="Week">
          <button id="week-prev" aria-label="Previous week">‹</button>
          <span id="week-label">Week –</span>
          <button id="week-next" aria-label="Next week">›</button>
        </div>
        <select id="horizon" class="waivers-only hidden" aria-label="Weeks to look ahead">
          <option value="1">This week only</option>
          <option value="3" selected>Next 3 weeks</option>
          <option value="5">Next 5 weeks</option>
          <option value="8">Next 8 weeks</option>
        </select>
        <select id="p-weeks" class="players-only hidden" aria-label="Weeks to show">
          <option value="1">1 week</option>
          <option value="4" selected>4 weeks</option>
          <option value="6">6 weeks</option>
          <option value="8">8 weeks</option>
        </select>
        <select id="scoring" class="players-only hidden" aria-label="Scoring"></select>
        <button class="btn small" id="refresh" title="Reload">↻</button>
      </div>
    </div>
    <div class="chips waivers-only hidden" id="pos-chips" style="margin-bottom:14px"></div>
    <div class="players-bar players-only hidden">
      <div class="psearch">
        <span class="icon">⌕</span>
        <input type="text" id="psearch" placeholder="Add a player… (e.g. Bijan, Chiefs)" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="suggest" aria-label="Search players">
        <ul class="suggest hidden" id="suggest" role="listbox"></ul>
      </div>
      <div class="chips" id="pchips"></div>
    </div>
    <div id="error" class="notice error hidden"></div>
    <div id="content"></div>
  </main>

  <footer>Projections from Sleeper · scored with your league's settings, or Sleeper's default when not signed in</footer>
</div>

<script>
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("fc." + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("fc." + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("fc." + k); } catch {} },
};

const state = {
  user: store.get("user"),          // {username, user_id, display_name}
  leagues: store.get("leagues") || [],
  leagueId: store.get("league"),
  tab: store.get("tab") || "lineup",
  week: null,
  currentWeek: null,
  horizon: 3,
  position: "",
  positions: [],
  picked: store.get("players") || [],   // [{id, name, position, team, image}]
  scoring: store.get("scoring") || "",  // "" = auto (league if signed in, else Sleeper default)
  pWeeks: 4,
};
const signedIn = () => !!(state.user && state.leagueId);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => (Math.round(n * 10) / 10).toFixed(1);

async function api(path) {
  const res = await fetch(path);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : `Request failed (${res.status})`);
  return body;
}

/* ---------- rendering helpers ---------- */
function initials(name) { return name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase(); }

function avatar(p) {
  return `<div class="avatar"><img src="${esc(p.image)}" alt="" loading="lazy"
    onerror="this.parentNode.textContent='${esc(initials(p.name)).replace(/'/g, "")}'"></div>`;
}

function statusBadge(p) {
  if (!p.injury_status) return "";
  const cls = p.injury_status === "Questionable" ? "q" : "o";
  return `<span class="badge ${cls}">${esc(p.injury_status)}</span>`;
}

function meta(p) {
  const opp = p.opponent ? `vs ${esc(p.opponent)}` : "BYE";
  return `<span>${esc(p.position)} · ${esc(p.team || "FA")}</span><span>${opp}</span>${statusBadge(p)}`;
}

function playerCell(p) {
  return `<div class="who-cell">${avatar(p)}<div style="min-width:0">
    <div class="pname">${esc(p.name)}</div><div class="pmeta">${meta(p)}</div></div></div>`;
}

function rangeText(r) {
  return r ? `${fmt(r.floor)}–${fmt(r.ceiling)}` : "";
}

function pts(p) {
  const r = p.range ? `<span class="rng" title="Floor–ceiling: 90% of simulated games land in this range">${rangeText(p.range)}</span>` : "";
  return `<div class="pts">${fmt(p.projected)}${r}</div>`;
}

function marketLegend(m) {
  const base = "Small numbers under points are the floor–ceiling range: 90% of 4,000 simulated games score at least the floor and 90% score at most the ceiling.";
  if (!m) return base + " Betting lines are only available for the current week.";
  if (m.error) return base + " " + esc(m.error) + ".";
  return base + ` This week: DraftKings lines for ${m.players} players across ${m.games} games (more appear closer to kickoff).`;
}

function loading(msg) {
  $("content").innerHTML = `<div class="card center"><div class="spinner"></div><div class="muted">${esc(msg)}</div></div>`;
}

function showError(el, msg) { el.textContent = msg; el.classList.toggle("hidden", !msg); }

/* ---------- views ---------- */
function teamRange(d) {
  const r = d.team_range;
  if (!r) return "";
  const c = d.current_range;
  const lo = Math.min(r.floor, c ? c.floor : r.floor), hi = Math.max(r.ceiling, c ? c.ceiling : r.ceiling);
  const span = Math.max(hi - lo, 1), pad = span * 0.08;
  const pct = (v) => `${(((v - lo + pad) / (span + 2 * pad)) * 100).toFixed(1)}%`;
  const bar = (x, cls) => `<div class="rbar ${cls}" title="Floor ${fmt(x.floor)} · expected ${fmt(x.expected)} · ceiling ${fmt(x.ceiling)}">
      <div class="band" style="left:${pct(x.floor)};width:calc(${pct(x.ceiling)} - ${pct(x.floor)})"></div>
      <div class="mk exp" style="left:${pct(x.expected)}"></div></div>`;
  const showCurrent = c && d.to_start.length;
  return `<div class="team-range">
    <div class="tr-nums">
      <div><span class="label">Team floor</span><b>${fmt(r.floor)}</b></div>
      <div><span class="label">Expected</span><b style="color:var(--accent)">${fmt(r.expected)}</b></div>
      <div><span class="label">Team ceiling</span><b>${fmt(r.ceiling)}</b></div>
    </div>
    ${showCurrent ? `<div class="tr-row"><span>Recommended</span>${bar(r, "")}</div>
      <div class="tr-row"><span>Current</span>${bar(c, "muted-bar")}<em>${fmt(c.floor)}–${fmt(c.ceiling)}</em></div>` : bar(r, "")}
    <div class="muted" style="font-size:12px;margin-top:8px">95% of simulated weeks score above the floor and 95% stay below the ceiling.</div>
  </div>`;
}

function renderLineup(d) {
  const summary = d.gain > 0
    ? `<div><div class="label">Projected points</div>
         <div class="big">${fmt(d.current_total)} <span class="muted">→</span> ${fmt(d.recommended_total)}</div></div>
       <div class="gain" style="font-size:22px">+${fmt(d.gain)} pts</div>`
    : `<div><div class="label">Projected points</div><div class="big">${fmt(d.recommended_total)}</div></div>
       <span class="ok-pill">✓ Your lineup is optimal</span>`;

  const changeList = (list) => list.map((p) =>
    `<li class="row" style="grid-template-columns:1fr auto">${playerCell(p)}${pts(p)}</li>`).join("");
  const changes = d.to_start.length ? `
    <div class="changes">
      <div class="card start"><div class="pad" style="padding-bottom:6px"><h3>Start</h3></div><ul class="rows">${changeList(d.to_start)}</ul></div>
      <div class="card bench"><div class="pad" style="padding-bottom:6px"><h3>Bench</h3></div><ul class="rows">${changeList(d.to_bench)}</ul></div>
    </div>` : "";

  const slots = d.slots.map((s) => s.player
    ? `<li class="row ${s.new ? "new" : ""}"><div class="slot">${esc(s.slot.replace("_FLEX", " FLX").replace("SUPER FLX", "SFLX"))}</div>
         <div style="min-width:0;display:flex;align-items:center;gap:8px">${playerCell(s.player)}${s.new ? '<span class="badge up">START</span>' : ""}</div>${pts(s.player)}</li>`
    : `<li class="row"><div class="slot">${esc(s.slot)}</div><div class="empty-slot">Empty — no eligible player</div><div></div></li>`).join("");
  const benchedIds = new Set(d.to_bench.map((p) => p.id));
  const bench = d.bench.map((p) => benchedIds.has(p.id)
    ? `<li class="row benched"><div class="slot">BN</div>
         <div style="min-width:0;display:flex;align-items:center;gap:8px">${playerCell(p)}<span class="badge down">BENCH</span></div>${pts(p)}</li>`
    : `<li class="row bench-row"><div class="slot">BN</div>${playerCell(p)}${pts(p)}</li>`).join("");

  $("content").innerHTML = `
    <div class="card pad summary" style="display:block">
      <div class="summary" style="margin:0">${summary}</div>${teamRange(d)}</div>
    ${changes}
    <div class="card"><ul class="rows">${slots}</ul>
      ${bench ? `<div class="section-label">Bench</div><ul class="rows">${bench}</ul>` : ""}</div>
    <div class="legend">Decisions use Sleeper projections. ${marketLegend(d.market)}</div>`;
}

function renderWaivers(d) {
  state.positions = d.positions;
  renderPosChips();
  if (!d.picks.length) {
    $("content").innerHTML = `<div class="card center"><div style="font-size:28px">✓</div>
      <div>No free agent projects better than your current players${state.position ? " at " + esc(state.position) : ""}.</div></div>`;
    return;
  }
  const max = Math.max(...d.picks.map((p) => p.gain));
  const span = d.weeks > 1 ? `wk ${d.week}–${d.week + d.weeks - 1}` : `wk ${d.week}`;
  const rows = d.picks.map((pk, i) => `
    <li class="pick">
      <div class="rank">${i + 1}</div>
      <div><div class="side-label add">Add · ${fmt(pk.add_value)} pts</div>${playerCell(pk.add)}</div>
      <div class="drop-cell">${pk.drop
        ? `<div class="side-label drop">Drop · ${fmt(pk.drop_value)} pts</div>${playerCell(pk.drop)}`
        : `<div class="side-label">Open roster spot</div><div class="muted">No ${esc(pk.add.position)} on your roster</div>`}</div>
      <div class="gainbox"><div class="gain">+${fmt(pk.gain)}</div><div class="muted" style="font-size:12px">${span}</div>
        <div class="bar"><i style="width:${Math.max(6, (pk.gain / max) * 100)}%"></i></div></div>
    </li>`).join("");
  $("content").innerHTML = `<div class="card">
    <div class="pick-head"><div>#</div><div>Pick up</div><div>Let go</div><div style="text-align:right">Net gain</div></div>
    <ul class="rows">${rows}</ul></div>`;
}

function renderPosChips() {
  const opts = ["", ...state.positions];
  $("pos-chips").innerHTML = opts.map((p) =>
    `<button class="chip" data-pos="${esc(p)}" aria-pressed="${p === state.position}">${p || "All"}</button>`).join("");
}

/* ---------- data loading ---------- */
let loadToken = 0;
async function load() {
  const token = ++loadToken;
  showError($("error"), "");
  if (state.tab === "players") return loadPlayers(token);
  if (!signedIn()) return renderSignedOut();
  const q = new URLSearchParams({ league_id: state.leagueId, user_id: state.user.user_id });
  if (state.week) q.set("week", state.week);
  try {
    if (state.tab === "lineup") {
      loading("Building your best lineup…");
      const d = await api(`/api/lineup?${q}`);
      if (token !== loadToken) return;
      setWeek(d.week);
      renderLineup(d);
    } else {
      loading("Scanning the waiver wire…");
      q.set("weeks", state.horizon);
      if (state.position) q.set("position", state.position);
      const d = await api(`/api/waivers?${q}`);
      if (token !== loadToken) return;
      setWeek(d.week);
      renderWaivers(d);
    }
  } catch (e) {
    if (token !== loadToken) return;
    $("content").innerHTML = "";
    showError($("error"), e.message);
  }
}

function renderSignedOut() {
  const what = state.tab === "lineup" ? "start/sit advice" : "waiver recommendations";
  $("content").innerHTML = `<div class="card signed-out-cta">
    <h2>Connect your Sleeper league</h2>
    <p>Enter your Sleeper username to get ${what} for your roster.</p>
    <button class="btn primary" data-action="sign-in">Connect Sleeper</button></div>`;
}

/* ---------- players ---------- */
async function loadPlayers(token) {
  renderPlayerChips();
  if (!state.picked.length) {
    $("content").innerHTML = `<div class="card center">
      <div style="font-size:28px">🔎</div>
      <div style="font-weight:650;margin-top:6px">Look up players</div>
      <div class="muted">Search above to add one player for a projection breakdown, or several to compare.</div></div>`;
    return;
  }
  loading("Pulling projections…");
  const q = new URLSearchParams({ ids: state.picked.map((p) => p.id).join(","), weeks: state.pWeeks });
  if (state.week) q.set("week", state.week);
  if (state.scoring) q.set("scoring", state.scoring);
  if (signedIn() && (!state.scoring || state.scoring === "league")) q.set("league_id", state.leagueId);
  try {
    const d = await api(`/api/players/compare?${q}`);
    if (token !== loadToken) return;
    setWeek(d.week);
    renderPlayers(d);
  } catch (e) {
    if (token !== loadToken) return;
    $("content").innerHTML = "";
    showError($("error"), e.message);
  }
}

function weekCell(w) {
  if (w.bye) return `<span class="muted">BYE</span>`;
  if (!w.projected) return `<span class="muted">—</span>`;
  const r = w.range ? `<span class="opp" title="Floor–ceiling">${rangeText(w.range)}</span>` : "";
  return `${fmt(w.points)}<span class="opp">vs ${esc(w.opponent)}</span>${r}`;
}

function statLine(p, w) {
  if (!w || !w.projected || w.bye || !p.key_stats.length) return "";
  return `<div class="statline">${p.key_stats.map((k) =>
    `<span><b>${fmt(w.stats[k.key] ?? 0)}</b> ${esc(k.label)}</span>`).join("")}</div>`;
}

function rangeVerdict(ps) {
  const withRange = ps.filter((p) => p.weeks[0]?.range);
  if (withRange.length < 2) return "";
  const safest = withRange.reduce((a, b) => (b.weeks[0].range.floor > a.weeks[0].range.floor ? b : a));
  const upside = withRange.reduce((a, b) => (b.weeks[0].range.ceiling > a.weeks[0].range.ceiling ? b : a));
  return `<div class="muted" style="font-size:13px;margin-top:2px">Safest floor: <b style="color:var(--text)">${esc(safest.name)}</b> (${fmt(safest.weeks[0].range.floor)})
    · Highest ceiling: <b style="color:var(--text)">${esc(upside.name)}</b> (${fmt(upside.weeks[0].range.ceiling)})</div>`;
}

function rangeBox(p, w, scaleMax) {
  const r = w?.range;
  if (!r) return "";
  const pct = (v) => `${Math.max(0, Math.min(100, (v / scaleMax) * 100)).toFixed(1)}%`;
  const chip = r.market
    ? `<span class="chip-mini dk" title="${r.lines.length ? "Centred on DraftKings lines: " + esc(r.lines.join(", ")) : ""}${r.team_points ? " · team implied " + fmt(r.team_points) + " pts" : ""}">DraftKings lines</span>`
    : `<span class="chip-mini model">History model</span>`;
  return `<div class="rangebox">
    <div class="rb-head"><span>Outcome range</span>${chip}</div>
    <div class="rb-nums"><div><b>${fmt(r.floor)}</b><small>Floor</small></div>
      <div><b style="color:var(--accent)">${fmt(r.expected)}</b><small>Expected</small></div>
      <div><b>${fmt(r.ceiling)}</b><small>Ceiling</small></div></div>
    <div class="rbar" title="Floor ${fmt(r.floor)} · expected ${fmt(r.expected)} · ceiling ${fmt(r.ceiling)} · Sleeper ${fmt(w.points)}">
      <div class="band" style="left:${pct(Math.max(r.floor, 0))};width:calc(${pct(r.ceiling)} - ${pct(Math.max(r.floor, 0))})"></div>
      <div class="mk slp" style="left:${pct(w.points)}"></div><div class="mk exp" style="left:${pct(r.expected)}"></div></div>
  </div>`;
}

function renderPlayers(d) {
  const ps = d.players;
  const multi = ps.length > 1;
  const nWeeks = ps[0]?.weeks.length || 0;
  const bestThis = multi ? Math.max(...ps.map((p) => p.this_week)) : null;

  // Verdict for this week
  let verdict = "";
  if (multi) {
    const sorted = [...ps].sort((a, b) => b.this_week - a.this_week);
    const [top, next] = sorted;
    verdict = top.this_week > 0
      ? `<div class="card pad verdict" style="margin-bottom:14px">${avatar(top)}
          <div><div class="label muted" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">Week ${d.week} pick</div>
          <div class="big" style="font-weight:750">Start ${esc(top.name)}</div>
          <div class="muted">${fmt(top.this_week)} pts · <span class="gain">+${fmt(top.this_week - next.this_week)}</span> over ${esc(next.name)}</div>
          ${rangeVerdict(ps)}</div></div>`
      : `<div class="card pad" style="margin-bottom:14px">None of these players has a projection for week ${d.week}.</div>`;
  }

  const scaleMax = Math.max(10, ...ps.map((p) => p.weeks[0]?.range?.ceiling || 0)) * 1.05;
  const cards = ps.map((p) => {
    const best = multi && p.this_week === bestThis && p.this_week > 0;
    const w0 = p.weeks[0];
    const thisWeek = w0 && w0.bye ? `<span class="muted" style="font-size:20px">BYE</span>`
      : w0 && !w0.projected ? `<span class="muted" style="font-size:20px">No projection</span>` : fmt(p.this_week);
    return `<div class="card pcard ${best ? "best" : ""}">${best ? '<span class="crown badge up">BEST</span>' : ""}
      ${playerCell({ ...p, opponent: w0?.opponent })}
      <div class="big">${thisWeek}</div>
      <div class="sub"><span>Wk ${d.week}</span>${nWeeks > 1 ? `<span><b>${fmt(p.total)}</b> total</span><span><b>${fmt(p.average)}</b> avg</span>` : ""}</div>
      ${rangeBox(p, w0, scaleMax)}
      ${statLine(p, w0)}</div>`;
  }).join("");

  let table = "";
  if (nWeeks > 1 || multi) {
    const head = `<tr><th>Week</th>${ps.map((p) => `<th>${esc(p.name)}</th>`).join("")}</tr>`;
    const body = Array.from({ length: nWeeks }, (_, i) => {
      const vals = ps.map((p) => p.weeks[i]);
      const top = Math.max(...vals.map((w) => (w.projected && !w.bye ? w.points : -1)));
      return `<tr><td>Wk ${vals[0].week}</td>${vals.map((w) =>
        `<td class="${multi && w.projected && !w.bye && w.points === top && top > 0 ? "win" : ""}">${weekCell(w)}</td>`).join("")}</tr>`;
    }).join("");
    const foot = nWeeks > 1
      ? `<tfoot><tr><td>Total</td>${ps.map((p) => `<td>${fmt(p.total)}</td>`).join("")}</tr></tfoot>` : "";
    table = `<div class="card scroll-x"><table class="grid"><thead>${head}</thead><tbody>${body}</tbody>${foot}</table></div>`;
  }

  $("content").innerHTML = `${verdict}<div class="pcards">${cards}</div>${table}
    <div class="legend">Scoring: ${esc(d.scoring)}. Big number is Sleeper's projection; the outcome range is
      simulated from betting lines (when posted) and how this player's past games compared with projections.
      <i style="background:var(--accent)"></i>expected <i style="background:var(--muted)"></i>Sleeper on the bar.
      ${marketLegend(d.market)}</div>`;
}

function renderPlayerChips() {
  $("pchips").innerHTML = state.picked.map((p) =>
    `<span class="pchip">${avatar(p)}${esc(p.name)}<button aria-label="Remove ${esc(p.name)}" data-remove="${esc(p.id)}">×</button></span>`).join("");
}

function renderScoringSelect() {
  const opts = [["default", "Sleeper default (PPR)"], ["half", "Half PPR"], ["std", "Standard"]];
  if (signedIn()) opts.unshift(["league", "My league scoring"]);
  if (!signedIn() && state.scoring === "league") state.scoring = "";
  const current = state.scoring || (signedIn() ? "league" : "default");
  $("scoring").innerHTML = opts.map(([v, l]) => `<option value="${v}" ${v === current ? "selected" : ""}>${l}</option>`).join("");
}

function addPlayer(p) {
  if (!state.picked.some((x) => x.id === p.id)) {
    if (state.picked.length >= 8) return showError($("error"), "You can compare up to 8 players.");
    state.picked.push({ id: p.id, name: p.name, position: p.position, team: p.team, image: p.image });
    store.set("players", state.picked);
  }
  $("psearch").value = "";
  closeSuggest();
  load();
}

let suggestions = [], active = -1, searchTimer = null, searchSeq = 0;
function closeSuggest() {
  $("suggest").classList.add("hidden");
  $("psearch").setAttribute("aria-expanded", "false");
  suggestions = []; active = -1;
}
function renderSuggest() {
  if (!suggestions.length) return closeSuggest();
  $("suggest").innerHTML = suggestions.map((p, i) =>
    `<li role="option" data-i="${i}" aria-selected="${i === active}"><div class="who-cell">${avatar(p)}
      <div><div class="pname">${esc(p.name)}</div><div class="pmeta"><span>${esc(p.position)} · ${esc(p.team || "FA")}</span>${statusBadge(p)}</div></div></div></li>`).join("");
  $("suggest").classList.remove("hidden");
  $("psearch").setAttribute("aria-expanded", "true");
}
async function runSearch(q) {
  const seq = ++searchSeq;
  try {
    const d = await api(`/api/players/search?q=${encodeURIComponent(q)}`);
    if (seq !== searchSeq) return;
    suggestions = d.results; active = suggestions.length ? 0 : -1;
    if (!suggestions.length) {
      $("suggest").innerHTML = `<li class="muted" style="cursor:default">No players match “${esc(q)}”</li>`;
      $("suggest").classList.remove("hidden");
      return;
    }
    renderSuggest();
  } catch { closeSuggest(); }
}

function setWeek(w) {
  state.week = w;
  $("week-label").textContent = `Week ${w}`;
  $("week-prev").disabled = w <= 1;
  $("week-next").disabled = w >= 18;
}

/* ---------- screens ---------- */
function showSetup() {
  $("setup").classList.remove("hidden");
  $("main").classList.add("hidden");
  $("account").classList.add("hidden");
  $("league-list").innerHTML = "";
  $("username").value = state.user?.username || "";
  $("username").focus();
}

function showMain() {
  $("setup").classList.add("hidden");
  $("main").classList.remove("hidden");
  $("account").classList.remove("hidden");
  document.querySelectorAll(".signed-in-only").forEach((el) => el.classList.toggle("hidden", !signedIn()));
  document.querySelectorAll(".signed-out-only").forEach((el) => el.classList.toggle("hidden", signedIn()));
  if (signedIn()) {
    $("who").textContent = state.user.display_name;
    $("league-select").innerHTML = state.leagues.map((l) =>
      `<option value="${esc(l.league_id)}" ${l.league_id === state.leagueId ? "selected" : ""}>${esc(l.name)}</option>`).join("");
  }
  renderScoringSelect();
  selectTab(state.tab, false);
  load();
}

function selectTab(tab, reload = true) {
  state.tab = tab;
  store.set("tab", tab);
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.tab === tab));
  document.querySelectorAll(".waivers-only").forEach((el) => el.classList.toggle("hidden", tab !== "waivers"));
  document.querySelectorAll(".players-only").forEach((el) => el.classList.toggle("hidden", tab !== "players"));
  if (reload) load();
}

function chooseLeague(id) {
  state.leagueId = id;
  store.set("league", id);
  showMain();
}

/* ---------- events ---------- */
$("user-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = $("username").value.trim();
  if (!username) return;
  const btn = $("user-submit");
  btn.disabled = true; btn.textContent = "Looking up…";
  showError($("setup-error"), "");
  $("league-list").innerHTML = "";
  try {
    const d = await api(`/api/user/${encodeURIComponent(username)}/leagues`);
    state.user = { username, user_id: d.user_id, display_name: d.display_name };
    state.leagues = d.leagues;
    store.set("user", state.user);
    store.set("leagues", state.leagues);
    if (!d.leagues.length) throw new Error(`No ${d.season} leagues found for ${username}.`);
    if (d.leagues.length === 1) return chooseLeague(d.leagues[0].league_id);
    $("league-list").innerHTML = `<div class="muted" style="font-size:13px">Choose a league</div>` +
      d.leagues.map((l) => `<button class="league-btn" data-id="${esc(l.league_id)}">
        <span><strong>${esc(l.name)}</strong></span><small>${l.teams ? l.teams + " teams" : ""}</small></button>`).join("");
  } catch (err) {
    showError($("setup-error"), err.message);
  } finally {
    btn.disabled = false; btn.textContent = "Find my leagues";
  }
});

$("league-list").addEventListener("click", (e) => {
  const b = e.target.closest(".league-btn");
  if (b) chooseLeague(b.dataset.id);
});
$("league-select").addEventListener("change", (e) => { state.leagueId = e.target.value; store.set("league", state.leagueId); load(); });
$("switch-user").addEventListener("click", () => { store.del("league"); state.leagueId = null; showSetup(); });
$("sign-in").addEventListener("click", showSetup);
$("skip-setup").addEventListener("click", () => { state.tab = "players"; showMain(); });
$("content").addEventListener("click", (e) => { if (e.target.closest("[data-action=sign-in]")) showSetup(); });
$("scoring").addEventListener("change", (e) => { state.scoring = e.target.value; store.set("scoring", state.scoring); load(); });
$("p-weeks").addEventListener("change", (e) => { state.pWeeks = +e.target.value; load(); });
$("pchips").addEventListener("click", (e) => {
  const b = e.target.closest("[data-remove]");
  if (!b) return;
  state.picked = state.picked.filter((p) => p.id !== b.dataset.remove);
  store.set("players", state.picked);
  load();
});
$("psearch").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (q.length < 2) { searchSeq++; return closeSuggest(); }
  searchTimer = setTimeout(() => runSearch(q), 180);
});
$("psearch").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" && suggestions.length) { e.preventDefault(); active = (active + 1) % suggestions.length; renderSuggest(); }
  else if (e.key === "ArrowUp" && suggestions.length) { e.preventDefault(); active = (active - 1 + suggestions.length) % suggestions.length; renderSuggest(); }
  else if (e.key === "Enter") { e.preventDefault(); if (suggestions[active]) addPlayer(suggestions[active]); }
  else if (e.key === "Escape") closeSuggest();
});
$("suggest").addEventListener("mousedown", (e) => {
  const li = e.target.closest("li[data-i]");
  if (li) { e.preventDefault(); addPlayer(suggestions[+li.dataset.i]); }
});
$("psearch").addEventListener("blur", () => setTimeout(closeSuggest, 100));
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => selectTab(t.dataset.tab)));
$("week-prev").addEventListener("click", () => { if (state.week > 1) { state.week--; load(); } });
$("week-next").addEventListener("click", () => { if (state.week < 18) { state.week++; load(); } });
$("refresh").addEventListener("click", load);
$("horizon").addEventListener("change", (e) => { state.horizon = +e.target.value; load(); });
$("pos-chips").addEventListener("click", (e) => {
  const c = e.target.closest(".chip");
  if (!c) return;
  state.position = c.dataset.pos;
  renderPosChips();
  load();
});

/* ---------- boot ---------- */
api("/api/state").then((s) => { if (!state.week && s.week) setWeek(s.week); }).catch(() => {});
if (signedIn() || state.tab === "players") showMain(); else showSetup();
</script>
</body>
</html>
